name: Dependencies

# cargo-deny on both workspaces, with deny.toml, and the check of THIRD_PARTY_NOTICES.md. Licenses,
# bans, sources and notices only change when a pull request changes the dependencies: `deny` is a
# required check. Advisories are published any day, so `advisories` runs daily as well, and isn't
# required: a new advisory against main shouldn't block every pull request, it gets its own fix.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deny-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deny:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: dino
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources
      - name: cloud
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: cloud/Cargo.toml
          command: check licenses bans sources
      # THIRD_PARTY_NOTICES.md, which ships in the app and the CLI tarball, names what Cargo.lock
      # and app/Package.swift say ships, with every license text: written by the cargo-about
      # version scripts/third-party.py names.
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices
        run: scripts/third-party.py --check

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: dino
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
      - name: cloud
        if: ${{ !cancelled() }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: cloud/Cargo.toml
          command: check advisories
