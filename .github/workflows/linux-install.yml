name: Linux install

# dino on Linux end to end, on real machines. The release workflow's tarballs (built here with a
# throwaway release key) are installed by scripts/install.sh from a local copy laid out as a
# release, on Ubuntu 22.04 and 24.04 (x86_64), Ubuntu 24.04 on arm64, and Fedora. Each one starts
# dinod, runs a stand-in agent session, runs dinod under systemd --user where there is one, installs
# and opens dino-tui (a stand-in), takes an update from a local feed, and stops
# (.github/linux-install-test.sh). GitHub's runners have nearly everything installed, so it also
# installs on the official ubuntu:22.04, ubuntu:24.04 and debian:12 images, as fresh as a machine
# gets (no curl, no libsqlite3, no systemd), and checks ubuntu:20.04 (glibc 2.31) is told what dino
# needs (.github/linux-fresh-test.sh). Runs on changes to what it tests, and by hand.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/install.sh
      - crates/dino/src/tui.rs
      - crates/dino-daemon/src/update.rs
      - crates/dino/src/systemd.rs
      - .github/linux-install-test.sh
      - .github/linux-fresh-test.sh
      - crates/dino-core/Cargo.toml
      - .github/workflows/release-linux.yml
      - .github/workflows/linux-install.yml

permissions: {}

concurrency:
  group: linux-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  key:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      public_key: ${{ steps.key.outputs.public_key }}
    steps:
      - id: key
        run: |
          openssl genpkey -algorithm ed25519 -out release-key.pem
          echo "public_key=$(openssl pkey -in release-key.pem -pubout -outform DER | tail -c 32 | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: throwaway-release-key
          path: release-key.pem
          retention-days: 1

  build:
    needs: key
    uses: ./.github/workflows/release-linux.yml
    permissions:
      contents: read
    with:
      public_key: ${{ needs.key.outputs.public_key }}
      id: install test

  ubuntu:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: art
          merge-multiple: true
      - run: .github/linux-install-test.sh ${{ matrix.target }} art art/release-key.pem

  fedora:
    needs: build
    runs-on: ubuntu-24.04
    container: fedora:42
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # What a Fedora workstation has, and the tools the test itself uses.
      - run: dnf install -y -q curl tar gzip findutils procps-ng util-linux util-linux-script openssl python3 git sqlite-libs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: art
          merge-multiple: true
      - run: .github/linux-install-test.sh linux-x64 art art/release-key.pem

  fresh:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            runner: ubuntu-24.04
            target: linux-x64
          - image: ubuntu:24.04
            runner: ubuntu-24.04
            target: linux-x64
          - image: debian:12
            runner: ubuntu-24.04
            target: linux-x64
          - image: ubuntu:24.04
            runner: ubuntu-24.04-arm
            target: linux-arm64
          - image: ubuntu:20.04
            runner: ubuntu-24.04
            target: linux-x64
            expect: old-glibc
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target }}
          path: art
      - run: sh .github/linux-fresh-test.sh ${{ matrix.target }} art ${{ matrix.expect || 'ok' }}
