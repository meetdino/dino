name: CI

# The account server in cloud/ has its own workflow (cloud.yml).
on:
  push:
    branches: [main]
    paths-ignore: ["cloud/**", ".github/workflows/cloud.yml"]
  pull_request:
    paths-ignore: ["cloud/**", ".github/workflows/cloud.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # dino-core calls proc_pidinfo, so the workspace only builds on macOS.
    # macOS runners are free for public repositories only; until launch, scripts/check.sh gates every push.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  app:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: swift build
        working-directory: app
        run: swift build -c release
