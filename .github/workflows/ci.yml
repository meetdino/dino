name: CI

# What a pull request has to pass, from this repository or a fork. Every job name here is a
# required check on main (see CONTRIBUTING.md); a job that has nothing to check for a pull request
# (the app, when only crates/ changed) is skipped, which counts as passed. `changes` decides that,
# and is required itself, so a failure there can't skip the rest into passing.
#
# Runs on pull_request only, never pull_request_target: a fork's code runs with a read-only token
# and no secrets. No job here needs either.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      app: ${{ steps.paths.outputs.app }}
      cloud: ${{ steps.paths.outputs.cloud }}
    steps:
      # A pull request checks out its merge with the base, whose first parent is the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: What changed
        id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
          else
            files=everything
          fi
          changed() {
            if [ "$files" = everything ] || printf '%s\n' "$files" | grep -Eq "$1"; then
              echo "$2=true" >>"$GITHUB_OUTPUT"
              echo "$2: yes"
            else
              echo "$2: no"
            fi
          }
          ci='|^\.github/workflows/ci\.yml$'
          changed "^crates/|^Cargo\.(toml|lock)\$|^rust-toolchain(\.toml)?\$$ci" rust
          changed "^app/$ci" app
          # cloud/ builds crates/dino-sync, which takes its version from the root Cargo.toml.
          changed "^cloud/|^crates/dino-sync/|^Cargo\.toml\$$ci" cloud
      # lint.sh checks the Rust formatting too, cloud/'s included, with rust-toolchain.toml's
      # rustfmt (cloud/rust-toolchain.toml names the same version).
      - run: rustup toolchain install --no-self-update
      - name: Tree checks
        run: scripts/lint.sh

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml picks the version.
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests read main's cache and don't write their own: the cache stays small and
          # what a fork builds never lands in what main uses.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  # The headless dinod and CLI on Linux (crates/ only; the app is macOS's). x86_64 and arm64.
  linux:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rusqlite links the system SQLite; the tests run git and tmux.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libsqlite3-dev tmux
      # rust-toolchain.toml picks the version.
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Any clippy warning fails the check. Where a lint is wrong for the code, an #[allow] on that
      # item, with a comment saying why, keeps it quiet.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The oldest Rust dino says it builds with (Cargo.toml's rust-version), so that stays true. On
  # macOS, where all of dino's code compiles.
  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the rust-version toolchain
        id: msrv
        run: |
          msrv=$(sed -n '/^\[workspace.package\]/,/^\[/s/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "toolchain=$msrv" >>"$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # RUSTUP_TOOLCHAIN wins over rust-toolchain.toml.
      - run: cargo check --workspace --all-targets --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.toolchain }}

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      # The packages, libghostty's framework among them, from SwiftPM's own cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('app/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: swift build
        working-directory: app
        run: swift build -c release
      - name: swift test
        working-directory: app
        run: swift test

  cloud:
    needs: changes
    if: needs.changes.outputs.cloud == 'true'
    # The account server, cloud/: a workspace of its own, which builds on Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dino
          POSTGRES_PASSWORD: dino
          POSTGRES_DB: dino_cloud
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U dino"
          --health-interval 2s
          --health-retries 30
    env:
      DINO_TEST_DATABASE_URL: postgres://dino:dino@127.0.0.1:55432/postgres
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cloud/rust-toolchain.toml picks the version.
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cloud
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
