name: Idea
description: Something dino could do, or do better
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation and what gets in the way, more than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: input
    id: agent
    attributes:
      label: Agent, if it's about one
      placeholder: Codex
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: How you work around it now, how other tools do it, screenshots.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you file it
      options:
        - label: I searched the existing issues, and this isn't one of them.
          required: true
