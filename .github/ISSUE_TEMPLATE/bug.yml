name: Bug
description: Something in dino doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. A security issue? Please don't file it here: see [SECURITY.md](https://github.com/meetdino/dino/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open a new tab
        2. Run claude
        3. …
  - type: input
    id: version
    attributes:
      label: dino version
      description: "`dino --version`, or dino → About dino"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - Homebrew
        - Dino.dmg
        - install.sh (the command line only)
        - Built from source
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.4 on an M3
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent, if one is involved
      description: Which, and its version.
      placeholder: Claude Code 2.1.288
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The end of `~/.config/dino/dinod.log` often says why. Check it for anything private first.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: For anything you can see in the app. Drag them in here.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you file it
      options:
        - label: I searched the existing issues, and this isn't one of them.
          required: true
