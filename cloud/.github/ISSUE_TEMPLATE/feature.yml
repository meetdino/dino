name: Idea
description: Something dino could do, or do better
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation and what gets in the way, more than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: How you work around it now, how other tools do it, screenshots.
