name: Bug
description: Something in the account server doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
  - type: input
    id: where
    attributes:
      label: Which server
      description: dino's own (cloud.meetdino.com), or self-hosted (which commit, which host)
    validations:
      required: true
  - type: input
    id: dino
    attributes:
      label: dino version
      description: "`dino --version`"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server logs leave out tokens and bodies, but check them for anything private first.
      render: text
