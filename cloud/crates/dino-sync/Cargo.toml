[package]
name = "dino-sync"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "dino's settings sync: records, clocks, merge and end-to-end encryption, shared by dinod and dino-cloud. A copy of crates/dino-sync from the dino repo (see UPSTREAM)."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
pasetors = { version = "0.7", default-features = false, features = ["v4", "std"] }
crypto_box = { version = "0.9", features = ["std", "salsa20"] }
hkdf = "0.12"
sha2 = "0.10"
blake2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
rand_chacha = "0.3"

