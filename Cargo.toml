[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "MIT"

[workspace.dependencies]
dino-core = { path = "crates/dino-core" }
dino-term = { path = "crates/dino-term" }
dino-daemon = { path = "crates/dino-daemon" }
alacritty_terminal = "0.26"
crossterm = "0.29"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The dino you use, built from main by app/build.sh --install (scripts/dev-rebuild.sh, every merge):
# a release but for thin LTO across 16 codegen units, so a rebuild takes a fraction of the time
# and cores. Releases (scripts/release.sh) keep full LTO.
[profile.devapp]
inherits = "release"
lto = "thin"
codegen-units = 16
