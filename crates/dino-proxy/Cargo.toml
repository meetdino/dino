[package]
name = "dino-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
anyllm_translate = "0.16.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
bytes = "1.12.1"
futures-util = "0.3.34"
memchr = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "system-proxy", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dino-router = { path = "../dino-router" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "time", "io-util"] }
