[package]
name = "dino-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "dino's settings sync: records, clocks and merge, shared by dinod and dino-cloud"

[features]
default = ["settings"]
# Mapping dino's own settings to records. dinod uses it; the account server doesn't, and leaving it
# out keeps dino-core (and the SQLite it links) out of the server's build.
settings = ["dep:dino-core"]

[dependencies]
dino-core = { workspace = true, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[dev-dependencies]
proptest = "1"

[[test]]
name = "settings"
required-features = ["settings"]
