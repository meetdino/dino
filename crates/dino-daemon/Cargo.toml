[package]
name = "dino-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
memchr = "2"
anyhow.workspace = true
dino-core.workspace = true
dino-term.workspace = true
dino-proxy = { path = "../dino-proxy" }
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking", "json"] }
sha2 = "0.10.9"
ring = "0.17"
hex = "0.4"
base64 = "0.22.1"
dino-sync = { path = "../dino-sync" }
rand_core = { version = "0.6", features = ["getrandom"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
