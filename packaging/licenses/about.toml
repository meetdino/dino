# cargo-about's settings for the Rust crates in the dino binary (scripts/third-party.py).
# dino ships for macOS and Linux (x86_64, arm64); the crates only other platforms pull in aren't in it.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
private = { ignore = true }
# The licenses deny.toml allows, as SPDX ids; a crate under another fails the generation.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
